<html lang="en">
<head>
  <title>HD-Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    connect-touchpoint {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<script>
    function toggleChat() {

    const chat = document.getElementById("chat-container");
    const openButton = document.getElementById("chat-container-open");

    if (chat.style.display === "none") {

        chat.style.display = "block";
        openButton.style.display = "none";

    } else {

        chat.style.display = "none";
        openButton.style.display = "block";

    }
}

  function chatClose() {

    alert("1 - closeChat entered");

    console.log("1 - closeChat entered");

    const touchpoint =
        document.querySelector("connect-touchpoint");

    alert(
        "2 - touchpoint element = " +
        (touchpoint ? "FOUND" : "NOT FOUND")
    );

    console.log("2 - touchpoint element:", touchpoint);

    if (!touchpoint) {
        alert("STOP - connect-touchpoint not found");
        return;
    }

    alert("3 - about to inspect onClose");

    console.log(
        "3 - current touchpoint.onClose:",
        touchpoint.onClose
    );

    alert("4 - closeChat finished");
}
   

  </script>
<script type="module">
    import { create } from
      "https://unpkg.com/@amazon-connect-touchpoint/web/lib/index.js?module";

    const touchpointConfig = {
      config: {
        chatEndpoint: "https://5xcen08wbl.execute-api.us-east-1.amazonaws.com/Prod",
        instanceId: "8ff06a42-6f88-4e35-8276-dcb687897ca3",
        contactFlowId: "98f7bff4-70e6-4ce2-83fe-b7d40bc0ccdc",
        participantDisplayName: "Customer",
        region: "us-east-1"
      },

      languageCode: "en-US",
      windowSize: "full",
      colorMode: "dark",
      input: "text",

      theme: {
        fontFamily:
          "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif",
        accent: "#AECAFF"
      },

      brandIcon: undefined,

      liveSync: {
        deploymentKey: "Zir9qLxkvwyrBBfaffawF",
        apiKey: "_tXMaf-U4HGD6X7JcsDE9lWY"
      }
    };

    document.querySelector("connect-touchpoint")
      .touchpointConfiguration = touchpointConfig;    
  </script>
  

<body style="background-image: url('InfoCentral.png'); background-size: cover;">
<img id="chat-container-open" src="https://nylic.my.salesforce.com/servlet/servlet.ImageServer?id=015Hq000006qZWT&oid=00D36000000rFTo&lastMod=1783723056000"
  style="
        width: 80px;
        height: 100px;
        cursor: pointer;
        position: fixed;
        right: 0px;
        top: 50%;
        z-index: 9998;
    "
    onclick="toggleChat()"
  
  >
  <div
    id="chat-container"
    style="
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 800px;
      height: 600px;
      z-index: 9999;
      overflow: hidden;
      display: none;
    "
  >
    <!-- Close and Minimize Button -->
    <div style="
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 5px;
    z-index: 10000;
">

    <button
        onclick="toggleChat()"
        title="Minimize Chat"
        style="
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 24px;
            cursor: pointer;
        "
    >&#8722;</button>

    <button
        onclick="chatClose()"
        title="End Chat"
        style="
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 6px;
            background: #b3261e;
            color: white;
            font-size: 22px;
            cursor: pointer;
        "
    >×</button>

</div>
    <connect-touchpoint></connect-touchpoint>
  </div>
</img>
  <a href="chat.html">Open Chat</a>
</body>
</html>
