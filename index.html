<html lang="en">
<head>
  <title>HD-Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    connect-touchpoint {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body style="
  background-image: url('NYL-ALR-Desktop2.png');
  background-size: cover;
">

  <!-- OPEN CHAT IMAGE -->
  <img
    id="chat-container-open"
    src="https://nylic.my.salesforce.com/servlet/servlet.ImageServer?id=015Hq000006qZWT&oid=00D36000000rFTo&lastMod=1783723056000"
    style="
      width: 80px;
      height: 100px;
      cursor: pointer;
      position: fixed;
      right: 0px;
      top: 50%;
      z-index: 9998;
    "
    onclick="toggleChat()"
  >

  <!-- CHAT WINDOW -->
  <div
    id="chat-container"
    style="
        position: fixed;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);

        width: 800px;
        height: 600px;

        border-radius: 24px;
        overflow: hidden;

        box-shadow: 0 12px 35px rgba(0,0,0,.25);

        z-index: 9999;
        display: none;
    "
  >

    <!-- CUSTOM CONTROLS -->
    <div style="
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
      z-index: 10000;
    ">

      <button
        onclick="toggleChat()"
        title="Minimize Chat"
        style="
          width: 35px;
          height: 35px;
          border: none;
          border-radius: 6px;
          background: rgba(255,255,255,0.15);
          color: white;
          font-size: 24px;
          cursor: pointer;
        "
      >&#8722;</button>

      <button
        onclick="chatClose()"
        title="End Chat"
        style="
          width: 35px;
          height: 35px;
          border: none;
          border-radius: 6px;
          background: #b3261e;
          color: white;
          font-size: 22px;
          cursor: pointer;
        "
      >×</button>

    </div>

    <connect-touchpoint></connect-touchpoint>

  </div>

  <a href="chat.html">Open Chat</a>


  <!-- NORMAL PAGE FUNCTIONS -->
  <script>
    function toggleChat() {

      const chat =
        document.getElementById("chat-container");

      const openButton =
        document.getElementById("chat-container-open");

      if (chat.style.display === "none") {

        chat.style.display = "block";
        openButton.style.display = "none";

      } else {

        chat.style.display = "none";
        openButton.style.display = "block";

      }
    }


 async function chatClose() {

    const handler = window.hdConversationHandler;

        if (!handler) {
        console.warn("HD-Chat: No active conversation");
        return;
    }

    try {

        // Send Close as a real customer utterance.
        // Agentic CX will route this to the Close flow.
        await handler.sendText("Close");

        console.log(
            "HD-Chat: Close sent to Agentic CX"
        );

        // Do NOT hide the chat here.
        // Leave it open so the customer can provide
        // their email address for the survey.

    } catch (error) {

        console.error(
            "HD-Chat: Failed to send Close",
            error
        );
    }
   // Watch the conversation for its actual end state
handler.subscribe((responses) => {

    if (!Array.isArray(responses)) {
        return;
    }

    const conversationEnded = responses.some(
        (response) =>
            response.type === "notice" &&
            response.conversationEnded === true
    );

    if (!conversationEnded) {
        return;
    }

    console.log(
        "HD-Chat: Conversation ended - collapsing chat"
    );

    const chat =
        document.getElementById("chat-container");

    const openButton =
        document.getElementById("chat-container-open");

    // Collapse HD-Chat only after Connect reports
    // that the conversation has actually ended.
    if (chat) {
        chat.style.display = "none";
    }

    if (openButton) {
        openButton.style.display = "block";
    }
});
}
  </script>


  <!-- AMAZON CONNECT TOUCHPOINT -->

          "98f7bff4-70e6-4ce2-83fe-b7d40bc0ccdc",

    primary: "#FFFFFF",

    // Secondary UI/text

agentMessageBubble: true,

userMessageBubbleStyle: {

},

agentMessageBubbleStyle: {

},

      brandIcon: "https://storage.googleapis.com/c7o-yagi5wlved-cdn/newyorklife/logos/8pvz9rhbdm_nyl-logo-rebrand.svgpng",

      liveSync: {

        deploymentKey:
          "Zir9qLxkvwyrBBfaffawF",

        apiKey:
          "_tXMaf-U4HGD6X7JcsDE9lWY"
      }
    };


    const touchpoint =
      document.querySelector(
        "connect-touchpoint"
      );


    console.log(
      "HD-Chat: configuring Touchpoint",
      touchpoint
    );  

window.hdConversationHandler = null;

touchpoint.onRef = (ref) => {

    console.log(
        "HD-Chat: Touchpoint REF received",
        ref
    );

    try {

        const handler =
            ref.getConversationHandler();

        window.hdConversationHandler =
            handler;

        console.log(
            "HD-Chat: Conversation Handler captured",
            handler
        );

    } catch (error) {

        console.error(
            "HD-Chat: Could not get conversation handler",
            error
        );
    }
};

touchpoint.touchpointConfiguration =
    touchpointConfig;


  </script>

</body>
</html>
