<html lang="en">
<head>
  <title>HD-Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    connect-touchpoint {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body style="
  background-image: url('InfoCentral.png');
  background-size: cover;
">

  <!-- OPEN CHAT IMAGE -->
  <img
    id="chat-container-open"
    src="https://nylic.my.salesforce.com/servlet/servlet.ImageServer?id=015Hq000006qZWT&oid=00D36000000rFTo&lastMod=1783723056000"
    style="
      width: 80px;
      height: 100px;
      cursor: pointer;
      position: fixed;
      right: 0px;
      top: 50%;
      z-index: 9998;
    "
    onclick="toggleChat()"
  >

  <!-- CHAT WINDOW -->
  <div
    id="chat-container"
    style="
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 800px;
      height: 600px;
      z-index: 9999;
      overflow: hidden;
      display: none;
    "
  >

    <!-- CUSTOM CONTROLS -->
    <div style="
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
      z-index: 10000;
    ">

      <button
        onclick="toggleChat()"
        title="Minimize Chat"
        style="
          width: 35px;
          height: 35px;
          border: none;
          border-radius: 6px;
          background: rgba(255,255,255,0.15);
          color: white;
          font-size: 24px;
          cursor: pointer;
        "
      >&#8722;</button>

      <button
        onclick="chatClose()"
        title="End Chat"
        style="
          width: 35px;
          height: 35px;
          border: none;
          border-radius: 6px;
          background: #b3261e;
          color: white;
          font-size: 22px;
          cursor: pointer;
        "
      >×</button>

    </div>

    <connect-touchpoint></connect-touchpoint>

  </div>

  <a href="chat.html">Open Chat</a>


  <!-- NORMAL PAGE FUNCTIONS -->
  <script>
    function toggleChat() {

      const chat =
        document.getElementById("chat-container");

      const openButton =
        document.getElementById("chat-container-open");

      if (chat.style.display === "none") {

        chat.style.display = "block";
        openButton.style.display = "none";

      } else {

        chat.style.display = "none";
        openButton.style.display = "block";

      }
    }


   function chatClose() {

    console.log(
        "HD-Chat: chatClose fired"
    );

    console.log(
        "HD-Chat: conversation handler =",
        window.hdConversationHandler
    );

    if (!window.hdConversationHandler) {

        alert(
            "Touchpoint found, but conversation handler is not active."
        );

        return;
    }

    alert(
        "SUCCESS - Active conversation handler found."
    );
}
  </script>


  <!-- AMAZON CONNECT TOUCHPOINT -->
  <script type="module">

    import { create } from
      "https://unpkg.com/@amazon-connect-touchpoint/web/lib/index.js?module";


    const touchpointConfig = {

      config: {

        chatEndpoint:
          "https://5xcen08wbl.execute-api.us-east-1.amazonaws.com/Prod",

        instanceId:
          "8ff06a42-6f88-4e35-8276-dcb687897ca3",

        contactFlowId:
          "98f7bff4-70e6-4ce2-83fe-b7d40bc0ccdc",

        participantDisplayName:
          "Customer",

        region:
          "us-east-1"
      },

      languageCode:
        "en-US",

      windowSize:
        "full",

      colorMode:
        "dark",

      input:
        "text",

      theme: {

        fontFamily:
          "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif",

        accent:
          "#AECAFF"
      },

      brandIcon:
        undefined,

      liveSync: {

        deploymentKey:
          "Zir9qLxkvwyrBBfaffawF",

        apiKey:
          "_tXMaf-U4HGD6X7JcsDE9lWY"
      }
    };


    const touchpoint =
      document.querySelector(
        "connect-touchpoint"
      );


    console.log(
      "HD-Chat: configuring Touchpoint",
      touchpoint
    );


    const touchpoint =
    document.querySelector("connect-touchpoint");

window.hdConversationHandler = null;

touchpoint.onRef = (ref) => {

    console.log(
        "HD-Chat: Touchpoint REF received",
        ref
    );

    try {

        const handler =
            ref.getConversationHandler();

        window.hdConversationHandler =
            handler;

        console.log(
            "HD-Chat: Conversation Handler captured",
            handler
        );

    } catch (error) {

        console.error(
            "HD-Chat: Could not get conversation handler",
            error
        );
    }
};

touchpoint.touchpointConfiguration =
    touchpointConfig;
};

  </script>

</body>
</html>
