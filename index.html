    <script>
    var webchat;
    const isMobile = window.innerWidth <= 768;	 

((window, document, node, props, configs) => {         
    if (window.TalkdeskChatSDK) {           
        console.error("TalkdeskChatSDK already included");           
        return;

    script.charset = "UTF-8";

    script.src = src;         
    script.async = true;         

    firstScriptTag.parentNode.insertBefore(script, firstScriptTag);         

    script.onload = () => {           
        webchat = TalkdeskChatSDK(node, props);           
        webchat.init(configs);      	
    };       

})(         
    window,         
    document,         
    "tdWebchat",         

    { 
        touchpointId: "345f52f215284dc38da26cac65bdf30d", 
        accountId: "", 
        region: "td-us-1" 
    },         

    { 
        enableValidation: false, 
        enableEmoji: true, 
        enableUserInput: true, 
	    enableResponsiveLayout: false, 
     

        styles: {

            chatThemeColor: "transparent",

            chatTitleIcon: "https://nylic--devrelease.sandbox.my.salesforce.com/servlet/servlet.FileDownload?file=015Nq00000NloQl%22",

            //botIcon: "https://www.newyorklife.com/assets/icons/nyl-logo.svg",

            startChatButtonBorderColor: "#000000",
            startChatButtonBackgroundColor: "#1D607C",

            customButtonBackgroundColor: "#1D607C",
            customButtonColor: "#FFFFFF",

            botBackgroundColor: "#f2f4f5",
            customMessageBackgroundColor: "#f2f4f5",

            chatContainerWidth: isMobile ? "60%" : "500px",
            chatContainerHeight: isMobile ? "85%" : "600px",

            buttonBackgroundColor: "#1D607C",
            buttonTextColor: "#FFFFFF",
            buttonHoverBackgroundColor: "#000000",

            triggerButtonWidth: "auto",
            triggerButtonHeight: isMobile ? "50px" : "170px",
            triggerButtonPositionBottom: isMobile ? "0px" : "50%",
            triggerButtonPositionRight: isMobile ? "0px" : "-18px",

            chatIcon: isMobile ? "https://nylic--devrelease.sandbox.my.salesforce.com/servlet/servlet.ImageServer?id=015Nq00000MXBMb&oid=00DNq00000J8ZQf" : "https://nylic--devrelease.sandbox.my.salesforce.com/servlet/servlet.ImageServer?id=015Nq00000Nlq2j&oid=00DNq00000J8ZQf"
        }
    }      
);


function findInShadowRoots(selector, root = document) {

    const results = [];

    const elements = root.querySelectorAll('*');	

    elements.forEach(el => {

        if (el.shadowRoot) {

            const found = el.shadowRoot.querySelectorAll(selector);

            if (found.length) {
                results.push(...found);
            }

            results.push(...findInShadowRoots(selector, el.shadowRoot));
        }
    });

    return results;
}

function setTalkdeskHeaderColor(color) {
    const minimizeButtons = findInShadowRoots('[data-qa="minimize-button"]');
	var radius = isMobile ? '25px 25px 0 0 ' : '50px 50px 0 0';

    minimizeButtons.forEach(button => {
        const headerDiv = button.parentElement;

        if (headerDiv) {
            headerDiv.style.setProperty(
                'background-color',
                color,
                'important'
            );
        }
		
		if (headerDiv) {		    
            headerDiv.style.setProperty(
                'border-radius',
                 radius,
                'important'
            );			
        }
    });

    return minimizeButtons.length > 0;
}

function setStyledWebchatAndBodyRoundEdges(radius) {
    const webchats = findInShadowRoots('[data-qa="StyledWebchat"]');

    webchats.forEach(webchat => {
        webchat.style.setProperty('border-radius', radius, 'important');

        const initialScreen = webchat.querySelector('[class*="initialScreen"]');
        const messageList = webchat.querySelector('[data-qa="message-list"]');

        if (initialScreen) {
            initialScreen.style.setProperty('border-radius', radius, 'important');
        }

        if (messageList) {
            messageList.style.setProperty('border-radius', radius, 'important');
        }
    });
}
function applyTalkdeskStyles() {

    const elements = findInShadowRoots(
        '[class*="headerTitle"], [class*="label"]'
    );
    var radius = isMobile ? "30px 30px 25px 25px" :	"50px 50px 25px 25px";

    elements.forEach(el => {

        // Skip required asterisk spans
        if (
            typeof el.className === 'string' &&
            el.className.includes('isRequired')
        ) {
            return;
        }

        // Force bold
        el.style.setProperty('font-weight', '700', 'important');

       
    });

    const allDivs = findInShadowRoots('div');

    allDivs.forEach(div => {

        const style = div.getAttribute('style') || '';

        // Detect the circular SVG avatar div
        if (
            style.includes('border-radius: 50%') &&
            style.includes('32px') &&
            style.includes('data:image/svg+xml')
        ) {

            div.style.setProperty('display', 'none', 'important');
        }
    });


    setTalkdeskHeaderColor('#1D607C');
	
    setStyledWebchatAndBodyRoundEdges(radius);
 
    fixEndChatButton();
	
	installConfirmationBridgeOnShadowRoots(document);
	
	requestAnimationFrame(applyTalkdeskStyles);
}

applyTalkdeskStyles();

document.addEventListener('click', function (event) {
    const webchatContainer = findInShadowRoots('[data-qa="StyledWebchat"]');
    const openButton = findInShadowRoots('.triggerButtonContainer_Y6_HL');

    if (!webchatContainer) return;

    const path = event.composedPath();

    // Ignore clicks originating inside any shadow DOM
    const isInsideShadowDOM = path.some(node => node instanceof ShadowRoot);

    if (isInsideShadowDOM) {
        return;
    }

    const clickedInsideWebchat = path.includes(webchatContainer);
    const clickedOpenButton = openButton && path.includes(openButton);

    if (!clickedInsideWebchat && !clickedOpenButton) {
        webchat.selfHostedApp.close();
    }
}, true);

function deepQuerySelector(selector, root = document) {
  const found = root.querySelector(selector);
  if (found) return found;

  for (const el of root.querySelectorAll("*")) {
    if (el.shadowRoot) {
      const result = deepQuerySelector(selector, el.shadowRoot);
      if (result) return result;
    }
  }

  return null;
}

function customCloseHandler() {
  webchat.selfHostedApp.webchatRef.current.closeWebchat();
}

function getReactProps(element) {
  if (!element) return null;

  const key = Object.keys(element).find(
    (name) =>
      name.startsWith("__reactProps$") ||
      name.startsWith("__reactEventHandlers$")
  );

  return key ? element[key] : null;
}

function findTalkdeskHandler(startElement) {
  let element = startElement;

  while (element) {
    const props = getReactProps(element);

    if (props) {
      const handler =
        props.onClick ||
        props.onPointerDown ||
        props.onMouseDown;

      if (typeof handler === "function") {
        return {
          element,
          handler,
          props
        };
      }
    }

    element = element.parentElement;
  }

  return null;
}

function findTalkdeskHandler(startElement) {
  let element = startElement;

  while (element) {
    const props = getReactProps(element);

    if (props) {
      const handler =
        props.onClick ||
        props.onPointerDown ||
        props.onMouseDown;

      if (typeof handler === "function") {
        return {
          element,
          handler,
          props
        };
      }
    }

    element = element.parentElement;
  }

  return null;
}

function fixEndChatButton() {
  installEndChatStyles();

  const btn = deepQuerySelector(
    '[data-qa="end-chat-conversation-button"]'
  );

  if (!btn) return;

  styleNativeCloseIcon(btn);
  forceEndChatPointer(btn);

  /*
   * Re-enable the real Talkdesk button, but allow its native
   * React event system to process the click.
   */
  if (btn.disabled) {
    btn.disabled = false;
  }

  btn.removeAttribute("disabled");
  btn.removeAttribute("aria-disabled");

  btn.style.setProperty(
    "pointer-events",
    "auto",
    "important"
  );

  btn.style.setProperty(
    "cursor",
    "pointer",
    "important"
  );

  btn.style.setProperty(
    "opacity",
    "1",
    "important"
  );
  if (btn.dataset.customEndHandlerAdded === "true") return;

btn.dataset.customEndHandlerAdded = "true";

btn.addEventListener(
  "click",
  function customEndChatClick(event) {
  
     const reactHandler = findTalkdeskHandler(btn);

    if (!reactHandler?.handler) {
      console.error(
        "Talkdesk React end-chat handler was not found."
      );
      return;
    }
	
    event.preventDefault();
    event.stopImmediatePropagation();
    event.stopPropagation();   

    let syntheticDefaultPrevented = false;
    let syntheticPropagationStopped = false;

    const reactLikeEvent = {
      nativeEvent: event,
      currentTarget: btn,
      target: btn,
      type: "click",

      bubbles: true,
      cancelable: true,
      defaultPrevented: false,

      button: event.button ?? 0,
      buttons: event.buttons ?? 0,
      detail: event.detail ?? 1,

      clientX: event.clientX ?? 0,
      clientY: event.clientY ?? 0,
      screenX: event.screenX ?? 0,
      screenY: event.screenY ?? 0,

      altKey: event.altKey ?? false,
      ctrlKey: event.ctrlKey ?? false,
      metaKey: event.metaKey ?? false,
      shiftKey: event.shiftKey ?? false,

      timeStamp: event.timeStamp,
      view: event.view || window,

      preventDefault() {
        syntheticDefaultPrevented = true;
        this.defaultPrevented = true;
      },

      stopPropagation() {
        syntheticPropagationStopped = true;
      },

      isDefaultPrevented() {
        return syntheticDefaultPrevented;
      },

      isPropagationStopped() {
        return syntheticPropagationStopped;
      },

      persist() {}
    };

    try {
      reactHandler.handler(reactLikeEvent);
    } catch (error) {
      console.error(
        "Talkdesk end-chat handler failed:",
        error
      );
    }
  },
  true
);
}

function forceEndChatPointer(btn) {
  if (!btn) return;

  btn.style.setProperty("cursor", "pointer", "important");

  btn.querySelectorAll("*").forEach((el) => {
    el.style.setProperty("cursor", "pointer", "important");
  });
}

function styleNativeCloseIcon(btn) {
  if (!btn) return;

  /*
   * Talkdesk creates a new button after minimize/reopen, so each
   * new button is styled once. Existing buttons are left untouched.
   */
  if (btn.dataset.customIconStyled === "true") {
    return;
  }

  const svg = btn.querySelector("svg");
  const path = svg?.querySelector("path");
  const wrapper = svg?.parentElement;

  if (!svg || !path || !wrapper) return;

  btn.dataset.customIconStyled = "true";

  const red = "#ff0000";

  /*
   * This wrapper filter was the cause of the gray color.
   */
  wrapper.style.setProperty(
    "filter",
    "none",
    "important"
  );

  wrapper.style.setProperty(
    "color",
    red,
    "important"
  );

  wrapper.style.setProperty(
    "opacity",
    "1",
    "important"
  );

  btn.style.setProperty(
    "color",
    red,
    "important"
  );

  /*
   * Preserve Talkdesk's original 24×24 SVG structure.
   */
  svg.setAttribute("height", "100%");
  svg.setAttribute("width", "100%");
  svg.setAttribute("fill", "currentColor");

  svg.style.setProperty(
    "color",
    red,
    "important"
  );

  svg.style.setProperty(
    "fill",
    "currentColor",
    "important"
  );

  svg.style.setProperty(
    "filter",
    "none",
    "important"
  );

  path.removeAttribute("stroke");
  path.setAttribute("fill", "currentColor");

  path.style.setProperty(
    "fill",
    "currentColor",
    "important"
  );
}

function installEndChatStyles() {
  if (
    document.getElementById(
      "custom-end-chat-styles"
    )
  ) {
    return;
  }

  const style = document.createElement("style");
  style.id = "custom-end-chat-styles";

  style.textContent = `
    [data-qa="end-chat-conversation-button"] {
      cursor: pointer !important;
      pointer-events: auto !important;
      opacity: 1 !important;
      color: #ff0000 !important;
    }

    [data-qa="end-chat-conversation-button"] > div {
      color: #ff0000 !important;
      filter: none !important;
      opacity: 1 !important;
    }

    [data-qa="end-chat-conversation-button"] svg {
      color: #ff0000 !important;
      fill: currentColor !important;
      filter: none !important;
    }

    [data-qa="end-chat-conversation-button"] svg path {
      fill: currentColor !important;
    }
  `;

  document.head.appendChild(style);
}
function installEndChatConfirmationBridge() {
  if (window.__endChatConfirmationBridgeInstalled) return;

  window.__endChatConfirmationBridgeInstalled = true;

  /*
   * Talkdesk can recreate its shadow roots after minimize/reopen,
   * so scan repeatedly from the existing styling loop.
   */
  installConfirmationBridgeOnShadowRoots(document);
}

function installConfirmationBridgeOnShadowRoots(root) {
  /*
   * If this root is a shadow root, install one delegated listener.
   */
  if (
    root instanceof ShadowRoot &&
    !root.__customEndChatBridgeInstalled
  ) {
    root.__customEndChatBridgeInstalled = true;

    root.addEventListener(
      "click",
      handleTalkdeskConfirmationClick,
      true
    );

    console.log(
      "Installed confirmation bridge on Talkdesk shadow root:",
      root
    );
  }

  root.querySelectorAll("*").forEach((element) => {
    if (!element.shadowRoot) return;

    installConfirmationBridgeOnShadowRoots(
      element.shadowRoot
    );
  });
}

function getReactClickHandler(element) {
  if (!element) return null;

  const reactKey = Object.keys(element).find(
    (key) =>
      key.startsWith("__reactProps$") ||
      key.startsWith("__reactEventHandlers$")
  );

  if (!reactKey) {
    console.error(
      "No React props key found on:",
      element
    );

    return null;
  }

  const props = element[reactKey];

  console.log(
    "Talkdesk confirmation React props:",
    props
  );

  return typeof props?.onClick === "function"
    ? props.onClick
    : null;
}

function invokeTalkdeskConfirm(button) {
  const handler = getReactClickHandler(button);

  if (!handler) {
    console.error(
      "Talkdesk confirmation onClick was not found."
    );

    return false;
  }

  console.log("Confirmation handler:", {
    name: handler.name,
    source: handler.toString()
  });

  try {
    /*
     * Production showed that confirm() accepts no event.
     */
    const result = handler.call(undefined);

    console.log(
      "Talkdesk confirm routine invoked.",
      result
    );

    return true;
  } catch (error) {
    console.error(
      "Talkdesk confirm routine threw an error:",
      error
    );

    return false;
  }
}

function handleTalkdeskConfirmationClick(event) {
  const path = event.composedPath();

  const confirmButton = path.find((element) => {
    return (
      element instanceof HTMLButtonElement &&
      element.getAttribute("aria-label") ===
        "confirm-action"
    );
  });

  if (!confirmButton) return;

  const confirmContainer = path.find((element) => {
    return (
      element instanceof HTMLElement &&
      typeof element.className === "string" &&
      element.className.includes(
        "confirmEndChatContainer"
      )
    );
  });

  if (!confirmContainer) return;

  /*
   * Prevent the same Talkdesk confirm routine from being
   * called once by us and once by React.
   */
  event.preventDefault();
  event.stopPropagation();
  event.stopImmediatePropagation();

  if (
    confirmButton.dataset.customConfirmInvoked === "true"
  ) {
    return;
  }

  confirmButton.dataset.customConfirmInvoked = "true";

  console.log(
    "Invoking Talkdesk's real confirm routine:",
    confirmButton
  );

  const invoked =
    invokeTalkdeskConfirm(confirmButton);

  if (!invoked) {
    confirmButton.dataset.customConfirmInvoked = "false";

    console.error(
      "Talkdesk confirm routine could not be invoked."
    );
  }
  waitForTalkdeskConfirmationToFinish(
    confirmContainer,
    confirmButton
  );
}

function waitForTalkdeskConfirmationToFinish(confirmContainer,confirmButton) {
  const startedAt = Date.now();
  const timeoutMs = 15000;

  function check() {
    const stillOpen =
      confirmContainer.isConnected &&
      isElementVisible(confirmContainer);

    const currentAction =
      confirmButton?.getAttribute("aria-label");

    /*
     * Normal Talkdesk completion:
     * confirmation disappeared.
     */
    if (!stillOpen) {
      console.log(
        "Talkdesk completed the end-chat transition normally."
      );

      return;
    }

    /*
     * Premature-enable behavior:
     * backend appears ended, but Talkdesk UI shows Try again.
     */
    if (currentAction === "retry-action") {
      console.log(
        "Talkdesk entered retry state; refreshing widget state."
      );

      refreshTalkdeskWidget();
      return;
    }

    if (Date.now() - startedAt >= timeoutMs) {
      console.error(
        "Talkdesk end-chat confirmation timed out."
      );

      return;
    }

    requestAnimationFrame(check);
  }

  requestAnimationFrame(check);
}

function closeTalkdeskWebChat() {
  try {
    const closeWebchat =
      webchat?.selfHostedApp?.webchatRef?.current
        ?.closeWebchat;

    if (typeof closeWebchat !== "function") {
      console.error(
        "Talkdesk closeWebchat method is unavailable.",
        {
          webchat,
          selfHostedApp: webchat?.selfHostedApp,
          webchatRef:
            webchat?.selfHostedApp?.webchatRef,
          current:
            webchat?.selfHostedApp?.webchatRef?.current
        }
      );

      return false;
    }

    closeWebchat.call(
      webchat.selfHostedApp.webchatRef.current
    );

    console.log(
      "Talkdesk closeWebchat method called successfully."
    );

    return true;
  } catch (error) {
    console.error(
      "Talkdesk closeWebchat failed:",
      error
    );

    return false;
  }
}

function isElementVisible(element) {
  if (!element?.isConnected) return false;

  const rect = element.getBoundingClientRect();
  const style = getComputedStyle(element);

  return (
    rect.width > 0 &&
    rect.height > 0 &&
    style.display !== "none" &&
    style.visibility !== "hidden" &&
    style.opacity !== "0"
  );
}

function invokeTalkdeskConfirm(button) {
  const handler = getReactClickHandler(button);

  if (!handler) return false;

  try {
    handler.call(undefined);
    return true;
  } catch (error) {
    console.error(
      "Talkdesk confirm routine failed:",
      error
    );

    return false;
  }
}
const observer = new MutationObserver(fixEndChatButton);

observer.observe(document.body, {
  childList: true,
  subtree: true,
  attributes: true,
  attributeFilter: ["disabled", "style", "class"]
});

fixEndChatButton();
installEndChatConfirmationBridge();

 </script>
