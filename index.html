<html lang="en">
  <head>
    <title>HD-Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      connect-touchpoint {
        height: 100%;
      }
    </style>
  </head>

  <<body style="background-image: url('InfoCentral.png'); background-size: cover;">
    <connect-touchpoint />
    <script type="module">
      // @amazon-connect-touchpoint/web — https://www.npmjs.com/package/@amazon-connect-touchpoint/web
      import { create } from "https://unpkg.com/@amazon-connect-touchpoint/web/lib/index.js?module";

      const START_CHAT_ENDPOINT =
    "https://timj.my.connect.aws/connectwidget/api/bfcf9d64-b440-436b-8390-07b493e0512e/start";

  const SNIPPET_ID =
    "YOUR_WIDGET_SNIPPET_ID";

  /*
   * Touchpoint calls the existing Amazon Connect Widget /start endpoint,
   * but that endpoint expects x-amz-snippet-id.
   *
   * Intercept only that request and add the required header.
   */
  const originalFetch = window.fetch.bind(window);

  window.fetch = async function(input, init = {}) {
    const requestUrl =
      typeof input === "string"
        ? input
        : input instanceof Request
          ? input.url
          : String(input);

    if (requestUrl.startsWith(START_CHAT_ENDPOINT)) {
      console.log("HD-Chat: intercepting StartChatContact request");

      const headers = new Headers(
        init.headers ||
        (input instanceof Request ? input.headers : undefined)
      );

      headers.set("x-amz-snippet-id", SNIPPET_ID);

      init = {
        ...init,
        headers
      };
    }

    return originalFetch(input, init);
  };

  // Load Touchpoint AFTER the fetch wrapper exists.
  await import(
    "https://unpkg.com/@amazon-connect-touchpoint/web/lib/index.js?module"
  );


      const touchpointConfig = {
        config: {
          chatEndpoint: START_CHAT_ENDPOINT,
          instanceId: "8ff06a42-6f88-4e35-8276-dcb687897ca3",
          contactFlowId: "98f7bff4-70e6-4ce2-83fe-b7d40bc0ccdc",
          participantDisplayName: "Customer",
          region: "us-east-1"
        },
        languageCode: "en-US",
        windowSize: "full",
        colorMode: "dark",
        input: "text",
        theme: {
          fontFamily: "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif, \"Apple Color Emoji\", \"Segoe UI Emoji\", \"Segoe UI Symbol\"",
          accent: "#AECAFF"
        },
        brandIcon: undefined,
        liveSync: {
          deploymentKey: "Zir9qLxkvwyrBBfaffawF",
          apiKey: "_tXMaf-U4HGD6X7JcsDE9lWY"
        }
      };

      document.querySelector("connect-touchpoint").touchpointConfiguration = touchpointConfig;

       </script>
  </body>
</html>
