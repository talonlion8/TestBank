<html>
  <head></head>
  <style>
        enegelai-bot {
        --enegelai-bot-header-background: rgba(5, 105, 255, 1.00);
        --enegelai-bot-header-color: rgba(255, 255, 255, 1.00);
        --enegelai-bot-message-user-background: rgba(250, 250, 250, 1.00);
        --enegelai-bot-message-user-color: rgba(0, 0, 0, 1.00);
        --enegelai-bot-message-bot-background: rgba(250, 250, 250, 1.00);
        --enegelai-bot-message-bot-color: rgba(0, 0, 0, 1.00);
        --enegelai-bot-anchor-background: rgba(5, 105, 255, 1.00);
        --enegelai-bot-anchor-border-color: rgba(5, 105, 255, 1.00);
        --enegelai-bot-form-submit-background: rgba(5, 105, 255, 1.00);
        --enegelai-bot-form-submit-border: rgba(5, 105, 255, 1.00);
        --enegelai-bot-popup-min-height: 200px;
    }


  </style>
  <script src="https://cdn.crescendo.ai/bot-widget/latest/enegelaibot.umd.js" type="text/javascript" async></script> 


  <body>
  <img
    id="chat-container-open"
    src="https://nylic.my.salesforce.com/servlet/servlet.ImageServer?id=015Hq000006qZWT&oid=00D36000000rFTo&lastMod=1783723056000"
    style="
      width: 80px;
      Height: 100px;
      position: fixed;
      right: 0;
      top: 55%;
      transform: translateY(-50%);
      background: transparent;
      padding: 0;
      margin: 0;
      border: none;
      z-index: 9998;
      cursor: pointer;
      onclick =toggleChat();
    ">
    <div id="Chat-Container" style="display: none;">
   <link href="https://cdn.crescendo.ai/bot-widget/latest/enegelaibot.css" rel="stylesheet"> 
      <script>
    (function() {
        var el = document.createElement('enegelai-bot');
        el.setAttribute('name', 'NYL AI Assistant');
        el.setAttribute('url', 'cxm-edge.crescendo.ai');
        el.setAttribute('org-id', 'newyorklife');
        el.setAttribute('bot-id', 'newyorklife-chat-81897630');
        el.setAttribute('logo-url', 'https://nylic.my.salesforce.com/servlet/servlet.ImageServer?id=015Hq000006qZWR&oid=00D36000000rFTo&%E2%80%A6');
        document.getElementById("Chat-Container").appendChild(el);
    })();

        function toggleChat() {

      const chat =
        document.getElementById("Chat-Container");      

      if (chat.style.display === "none") {

        chat.style.display = "block";        

      } else {

        chat.style.display = "none";        

      }
    }
</script>
      </div></img>
  </body>
    
</html>
