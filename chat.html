
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>NYL AI Assistant</title>

  <!-- Crescendo Stylesheet -->
  <link
    href="https://cdn.crescendo.ai/bot-widget/latest/enegelaibot.css"
    rel="stylesheet"
  >

  <style>

    /* Crescendo Widget Styling */
    enegelai-bot {
      --enegelai-bot-header-background: rgba(5,105,255,1);
      --enegelai-bot-header-color: white;

      --enegelai-bot-message-user-background: #fafafa;
      --enegelai-bot-message-user-color: black;

      --enegelai-bot-message-bot-background: #fafafa;
      --enegelai-bot-message-bot-color: black;

      --enegelai-bot-anchor-background: #0569ff;
      --enegelai-bot-anchor-border-color: #0569ff;

      --enegelai-bot-form-submit-background: #0569ff;
      --enegelai-bot-form-submit-border: #0569ff;

      --enegelai-bot-popup-min-height: 200px;
    }

    /* Hide Crescendo's Default Launcher */
    enegelai-bot::part(anchor) {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* Custom NYL Launcher */
    #chat-container-open {
      width: 80px;
      height: 100px;
      position: fixed;
      right: 0;
      top: 55%;
      transform: translateY(-50%);

      background: transparent;
      padding: 0;
      margin: 0;
      border: none;

      z-index: 9998;
      cursor: pointer;
    }

  </style>

  <!-- Crescendo Widget Library -->
  <script
    src="https://cdn.crescendo.ai/bot-widget/latest/enegelaibot.umd.js"
    defer>
  </script>

</head>

<body>

  <!-- Custom NYL Chat Icon -->
  <img
    id="chat-container-open"
    src="https://nylic.my.salesforce.com/servlet/servlet.ImageServer?id=015Hq000006qZWT&amp;oid=00D36000000rFTo&amp;lastMod=1783723056000"
    alt="Open NYL AI Assistant"
    role="button"
    tabindex="0"
  >

  <!-- Crescendo Widget Container -->
  <div id="Chat-Container"></div>

  <script>
    (function () {

      // ========================================
      // 1. CREATE CRESCENDO BOT
      // ========================================

      const bot = document.createElement("enegelai-bot");

      bot.id = "Chat-Bot";

      bot.setAttribute("name", "NYL AI Assistant");
      bot.setAttribute("url", "cxm-edge.crescendo.ai");
      bot.setAttribute("org-id", "newyorklife");
      bot.setAttribute("bot-id", "newyorklife-chat-81897630");

      // Replace with your full logo URL
      bot.setAttribute(
        "logo-url",
        "YOUR_FULL_LOGO_URL"
      );

      document
        .getElementById("Chat-Container")
        .appendChild(bot);

      const customIcon =
        document.getElementById("chat-container-open");


      // ========================================
      // 2. OPEN CHAT FROM CUSTOM IMAGE
      // ========================================

      function openCrescendoChat() {

        const launcher = bot.shadowRoot
          ?.querySelector("cb-anchor")
          ?.shadowRoot
          ?.querySelector(".anchor-button");

        if (launcher) {

          launcher.click();

          console.log("Crescendo launcher clicked");

        } else {

          console.warn("Crescendo launcher not ready");

        }
      }

      customIcon.addEventListener(
        "click",
        openCrescendoChat
      );

      // Keyboard accessibility
      customIcon.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openCrescendoChat();
        }
      });


      // ========================================
      // 3. MONITOR CHAT OPEN / MINIMIZED STATE
      // ========================================

      let wrapperObserver = null;
      let currentWrapper = null;

      function updateIconVisibility() {

        const wrapper = bot.shadowRoot
          ?.querySelector(".cb-wrapper");

        if (!wrapper) {
          return;
        }

        const isOpen =
          wrapper.classList.contains("cb-open");

        // Hide custom icon when chat is open
        // Show custom icon when chat is minimized
        customIcon.style.display =
          isOpen ? "none" : "block";

        console.log("Crescendo chat open:", isOpen);
      }


      // ========================================
      // 4. OBSERVE CRESCENDO WRAPPER
      // ========================================

      function observeWrapper() {

        const wrapper = bot.shadowRoot
          ?.querySelector(".cb-wrapper");

        if (!wrapper) {
          return;
        }

        // Avoid duplicate observers
        if (wrapper === currentWrapper) {
          return;
        }

        // Disconnect old wrapper observer
        if (wrapperObserver) {
          wrapperObserver.disconnect();
        }

        currentWrapper = wrapper;

        // Watch for cb-open class changes
        wrapperObserver = new MutationObserver(
          updateIconVisibility
        );

        wrapperObserver.observe(wrapper, {
          attributes: true,
          attributeFilter: ["class"]
        });

        updateIconVisibility();
      }


      // ========================================
      // 5. WATCH FOR WIDGET RENDERING
      // ========================================

      function initializeObserver() {

        if (!bot.shadowRoot) {
          setTimeout(initializeObserver, 200);
          return;
        }

        // Watch for wrapper replacements
        const rootObserver = new MutationObserver(
          observeWrapper
        );

        rootObserver.observe(bot.shadowRoot, {
          childList: true,
          subtree: true
        });

        // Observe current wrapper immediately
        observeWrapper();
      }

      initializeObserver();


      // ========================================
      // 6. HIDE ORIGINAL CRESCENDO ANCHOR
      // ========================================

      function hideOriginalAnchor() {

        const root = bot.shadowRoot;

        if (!root) {
          return;
        }

        // Add a persistent CSS rule inside
        // Crescendo's Shadow DOM
        const style = document.createElement("style");

        style.textContent = `
          cb-anchor {
            opacity: 0 !important;
            pointer-events: none !important;
          }
        `;

        root.appendChild(style);

        console.log("Original Crescendo launcher hidden");
      }

      function waitForAnchor() {

        if (!bot.shadowRoot) {
          setTimeout(waitForAnchor, 200);
          return;
        }

        hideOriginalAnchor();
      }

      waitForAnchor();

    })();
  </script>

</body>
</html>
